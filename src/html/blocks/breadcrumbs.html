                <li class="breadcrumbs-nav__li"><a href="index.html" class="breadcrumbs-nav__link">Home</a></li>

            </ul>
        </nav>
    </div>
</section>

<script>
    const breadcrumbsItems = () => {
        const pageTitles = {
            "about.html": "About Us",
            "services.html": "Services",
            "service-details.html": "Service Details",
            "contact.html": "Contact Us",
        };
        const currentPath = window.location.pathname.split('/').pop();

        if (pageTitles[currentPath]) {
            document.getElementById('breadcrumbs-title').textContent = pageTitles[currentPath];
            document.getElementById('breadcrumbs-last').textContent = pageTitles[currentPath];
        }
    }
    breadcrumbsItems();
</script>
