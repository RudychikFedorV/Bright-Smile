<article class="blog-v2-left">
    <div class="blog-v2-img">
        <img src="img/blog-v2/img-@@IMG.jpg" alt="IMG">
        <div class="blog-v2-img__blocks d-flex">
            <div class="blog-v2-img__block">
                <span class="blog-v2-img__block-icon">
                    <img src="img/blog-v2/user.svg" alt="Icon">
                </span>
                <p class="blog-v2-img__block-txt">@@name</p>
            </div>
            <div class="blog-v2-img__block">
                <span class="blog-v2-img__block-icon">
                    <img src="img/blog-v2/calendar.svg" alt="Icon">
                </span>
                <p class="blog-v2-img__block-txt">@@day</p>
            </div>
            <div class="blog-v2-img__block">
                <span class="blog-v2-img__block-icon">
                    <img src="img/blog-v2/comments.svg" alt="Icon">
                </span>
                <p class="blog-v2-img__block-txt">@@comments</p>
            </div>
        </div>
    </div>
    <div class="blog-v2-container">
        <h1 class="blog-v2-container__title">@@title</h1>
        <p class="blog-v2-container__desc">@@desc</p>
        <a href="@@link" class="blogs-item__btn">Read More
            <span>
                <img src="img/blogs/arrow-next.svg" alt="arrow next">
            </span>
        </a>
    </div>
</article>
